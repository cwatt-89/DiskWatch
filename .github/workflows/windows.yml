name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach build files to releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish self-contained exe
        working-directory: windows
        run: dotnet publish DiskWatch.Windows.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Self-test (scanner + safety rules)
        working-directory: windows
        run: publish\DiskWatch.exe --selftest $env:USERPROFILE | Out-Host
        shell: pwsh
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: DiskWatch-windows-x64
          path: windows/publish/DiskWatch.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/publish/DiskWatch.exe
